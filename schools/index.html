<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UK schools map — now part of Check an address</title>
<!-- The schools map was merged into /check/ as a layer, so the site is one map
     rather than several tabs. This page stays as a redirect so every existing
     link and any indexed result still lands somewhere useful. GitHub Pages
     cannot send a real 301; canonical + an immediate meta refresh is what
     search engines treat as a permanent move. -->
<link rel="canonical" href="https://safe-route.app/check/?schools">
<meta http-equiv="refresh" content="0; url=/check/?schools">
<meta name="robots" content="noindex, follow">
<script>location.replace('/check/?schools' + location.hash);</script>
</head>
<body style="background:#0A0D12;color:#C9D1D9;font-family:system-ui,sans-serif;padding:40px">
<p>The schools map is now part of <a href="/check/?schools" style="color:#3FD9C0">Check an address</a>.</p>
</body>
</html>
