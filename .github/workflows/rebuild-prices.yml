# Rebuilds the home-prices layer on /check/ (prices/data/) once a month.
# Kept apart from rebuild-safety-pages (the 2nd) and rebuild-schools (the 4th),
# so a prices failure cannot cost either of them a rebuild, and vice versa.
#
# WHAT IT FETCHES. tools/build-prices.mjs runs every source module in
# tools/prices/sources/ (tools/prices/README.md; tools/prices/parked/ is never
# loaded). The recorded-sales feeds (NYC, DC, Baltimore, Charlotte,
# Minneapolis: cadence monthly) are fetched every run, their window
# moving with the data; their sales are aggregated into census-tract medians
# and never published one by one. The rest are annual and
# semi-annual statistics (ONS MSOA medians, LPS/NISRA ward medians, ACS
# 5-year, CT's grand-list-year sales, the 2021 Census), so the monthly run
# does not refetch those by habit: it
# asks each upstream file the tiles were built from whether it changed (a
# HEAD, ETag / Last-Modified; a one-byte ranged GET where HEAD is refused; a
# small file compared by its bytes; a source's probe() can also report a new
# release at a new URL). An unchanged source re-emits its tiles byte-identical;
# a changed one is refetched; the static 2021 Census is never asked. A change
# to a source's module, its lookups or its cities (index.json `inputs`)
# rebuilds it too. A fetch that empties a city, keeps nothing in scope or
# quietly loses a tenth of its areas is refused and the snapshot kept. A
# deliberate refetch is a dispatch of this workflow with `refresh: <source
# id>` or `refresh: all`.
#
# THE SAFETY RULE. A source whose fetch fails re-emits its areas from the
# current tiles (the build prints ::warning::), so an unreachable host can
# never empty a region from the map. If the build itself fails (a contract
# violation) it writes nothing, and if verify-prices fails nothing is
# committed: the published tiles stay as they were either way.
#
# REACHABILITY. Every host was tested from residential IPs only. Run
# probe-price-hosts.yml (dispatch) to see which answer GitHub's runners; a
# source whose host refuses them simply keeps its snapshot, and becomes a hand
# refresh (node tools/build-prices.mjs --only <src> on a laptop). The likeliest
# to refuse are the self-hosted city and county ArcGIS servers with no ArcGIS
# Online copy: Charlotte's gis.charlottenc.gov and Hennepin's gis.hennepin.us.
name: rebuild-prices

on:
  schedule:
    - cron: '41 5 5 * *'   # 5th of each month, 05:41 UTC (after the safety pages on the 2nd and schools on the 4th)
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Sources to refetch deliberately, comma-separated (e.g. "acs-tract"), or "all". Empty = the normal monthly run.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: rebuild-prices
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # Measured locally (Sept 2026): the four phase-1 sources from a cold
    # cache are about 300 MB of downloads (ACS tables and tract shapefiles,
    # the ONS workbooks and boundary pages, the OSNI wards GeoJSON, the
    # StatCan tract zip); when upstream has not changed they cost ~50 HEAD
    # requests. The five MONTHLY sale feeds are downloaded whole on every
    # run, as the runner starts with an empty cache: about 133 MB a month
    # (NYC 78 MB, of which PLUTO 42, the Digital Tax Map condominium tables
    # 14 and DOF's yearly workbooks 17 are reference data that seldom change;
    # DC 24 MB, 21 of it the whole tax-roll table; Maryland 9 MB; Charlotte
    # 13 MB in ~190 queries to gis.charlottenc.gov, most of them parcel
    # lookups; Hennepin 8 MB in ~16 queries to gis.hennepin.us). Processing
    # is ~15 s. 45 minutes leaves room for ONS's rate limit (Retry-After is
    # honoured) without letting a hung request run for hours; Charlotte and
    # Hennepin also give up on their own after 15 and 12 minutes, so a slow
    # self-hosted server costs only its own city's month. (A raw-cache
    # restore would save little as things stand: the downloader refetches
    # files older than 30 days anyway, about one run's gap.)
    timeout-minutes: 45
    steps:
      # One commit is enough: verify-prices reads the previous index.json from
      # HEAD for its drift check, and nothing here dates files by history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # 24: the version every determinism and byte-identity check of this
      # build was run on (Sept 2026).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Passed through env, never pasted into the script by ${{ }}: a value
      # is data, and cannot become a command.
      - name: Build price tiles
        env:
          REFRESH: ${{ github.event.inputs.refresh }}
        run: |
          set -o pipefail
          if [ -n "$REFRESH" ]; then
            echo "deliberate refresh of: $REFRESH"
            node tools/build-prices.mjs --refresh "$REFRESH" | tee /tmp/build.txt
          else
            node tools/build-prices.mjs | tee /tmp/build.txt
          fi

      # Gates the commit. --refresh exempts a deliberately refreshed source
      # from the drift check (a new vintage may legitimately move more).
      - name: Verify price tiles
        env:
          REFRESH: ${{ github.event.inputs.refresh }}
        run: |
          if [ -n "$REFRESH" ]; then
            node tools/verify-prices.mjs --reference-optional --refresh "$REFRESH"
          else
            node tools/verify-prices.mjs --reference-optional
          fi

      # /check/ quotes where prices cover (data-fact="prices-where"), copied
      # from index.json by tools/sync-site-facts.mjs.
      - name: Keep the price facts on the site true
        run: node tools/sync-site-facts.mjs

      - name: Commit + push if anything changed
        env:
          REFRESH: ${{ github.event.inputs.refresh }}
        run: |
          git config user.name "saferoute-bot"
          git config user.email "minhaj@safe-route.app"
          # Scoped, never -A: raw downloads go to the OS temp dir, but a
          # stray file must never be published by accident. (A path that does
          # not exist yet, e.g. tools/data/prices/ before any lookup is
          # vendored, would make git add fail, so each is added if present.)
          for p in prices/ check/index.html tools/data/prices/; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          # Which sources were fetched, reused or fell back, for the log.
          summary=$(grep -E '^    [a-z-]+ +[0-9,]+  (fetched|snapshot|snapshot-after-failure)$' /tmp/build.txt | awk '{print $1" "$3}' | paste -sd, - || true)
          git commit -m "prices: monthly refresh${REFRESH:+ (refresh: $REFRESH)}" -m "${summary:-see the workflow log}"
          # main may move while this runs. The tiles are generated output and
          # nothing else writes them, so rebase after committing (never
          # autostash generated files; see rebuild-safety-pages.yml).
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $i) — rebasing onto main"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::rebase conflicted with main — re-run the prices rebuild"
              exit 1
            fi
          done
          echo "::error::push failed three times"
          exit 1
