# Rebuilds the /safety/ programmatic pages monthly so they track the crime-data
# cadence (NYPD YTD refreshes roughly quarterly; a monthly rebuild also keeps
# lastmod honest for crawlers). Safe against prod: generate-data.mjs paces
# itself (1 concurrent, 1.2s delay) under the backend's 60/min rate limit, and
# retries absorb a free-dyno cold start.
#
# REQUIRED SECRET (Settings → Secrets and variables → Actions):
#   SAFEROUTE_API_KEY — same shared secret the app uses.
name: rebuild-safety-pages

on:
  schedule:
    - cron: '17 9 2 * *'   # 2nd of each month, 09:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # Explicit, because the default is 6 hours. Sized from measured runs, not
    # from GEN_DELAY_MS: run #4 (2026-09-02, the last ten-city run) spent
    # 58m33s in the data step for 1,222 areas — 2.9 s/area, so the free-tier
    # backend adds ~1.7s on top of the 1.2s pace. Every other step is noise
    # (gazetteers 18s, basemaps 2s, render 7s, commit 27s). At 1,917 areas
    # that projects to ~92 min of fetching and ~93 min overall.
    # 180 is therefore about 2x the expected run, not the wide margin it looks
    # like — a bad month of cold starts (5 attempts, 30s backoff, 45s timeouts)
    # eats into it. Re-measure before trusting it against city #20.
    # The cap is cheap: commit/push is the last step, so a killed run publishes
    # nothing and the next run redoes the work.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh gazetteers (boundaries rarely change; cheap)
        # build-gazetteer-la preserves committed density-snapped centroids, so
        # this does not undo snap-la-centroids. The snap step itself is not run
        # monthly — boundaries are stable and the snapped points are committed.
        run: |
          node tools/build-gazetteer-nyc.mjs
          node tools/build-gazetteer-london.mjs
          node tools/build-gazetteer-chicago.mjs
          node tools/build-gazetteer-la.mjs
          node tools/build-gazetteer-sf.mjs
          node tools/build-gazetteer-seattle.mjs
          node tools/build-gazetteer-toronto.mjs
          node tools/build-gazetteer-dc.mjs
          node tools/build-gazetteer-boston.mjs
          node tools/build-gazetteer-philly.mjs
          node tools/build-gazetteer-baltimore.mjs
          node tools/build-gazetteer-sandiego.mjs
          node tools/build-gazetteer-neworleans.mjs
          node tools/build-gazetteer-detroit.mjs
          node tools/build-gazetteer-minneapolis.mjs
          node tools/build-gazetteer-cleveland.mjs
          node tools/build-gazetteer-kansascity.mjs
          # denver, longbeach and vancouver are DELIBERATELY not rebuilt here.
          # They do have a builder — tools/build-gazetteer-calibration.mjs takes
          # exactly these ids as args — but it emits calibration-grade sets, and
          # re-running it would regress all three published ones:
          #   * It never emits `borough`. render-pages.mjs groups the city hub by
          #     that field and calls b.toLowerCase() on it, so a rebuilt gazetteer
          #     crashes the render step. The field was hand-backfilled into these
          #     three in 05a8cb25 for exactly that reason.
          #   * longbeach would come back as all 123 boundary areas. The published
          #     set is the curated 96: 73f0dbe6 dropped 25 "Unassigned" marina,
          #     park and power-station fragments plus a bare "AOC7" code and a
          #     duplicate, and the backend normaliser was refitted (241 → 326) for
          #     the 96. Restoring the artifacts would re-add thin pages AND leave
          #     the city scored by a normaliser fitted to a different area set.
          # Worse, run with NO args it rebuilds every calibration city, which
          # includes baltimore — replacing its published 56 CSAs with 256 NSAs.
          # If one of these ever needs rebuilding, give it its own per-city
          # builder (as baltimore has) and add that here; do not add the
          # calibration script. Their data and basemaps still refresh below.

      # EVERY published city must appear in all three steps below. Nine cities
      # (baltimore, denver, longbeach, sandiego, vancouver, neworleans, detroit,
      # minneapolis, cleveland — 704 live pages) were missing here until
      # 2026-09-09: they were added to the site but never to this workflow, so
      # they re-rendered every month from whatever crime data happened to be
      # committed and would never have refreshed again. Adding a city to
      # render-pages.mjs is NOT enough; it has to be added here too.
      - name: Refresh safety data (paced against prod backend)
        env:
          SAFEROUTE_API_KEY: ${{ secrets.SAFEROUTE_API_KEY }}
          SAFEROUTE_BASE_URL: https://saferoute-backend-w5yf.onrender.com
        run: |
          node tools/generate-data.mjs --force --city new-york
          node tools/generate-data.mjs --force --city london
          node tools/generate-data.mjs --force --city chicago
          node tools/generate-data.mjs --force --city la
          node tools/generate-data.mjs --force --city sf
          node tools/generate-data.mjs --force --city seattle
          node tools/generate-data.mjs --force --city toronto
          node tools/generate-data.mjs --force --city dc
          node tools/generate-data.mjs --force --city boston
          node tools/generate-data.mjs --force --city philly
          node tools/generate-data.mjs --force --city baltimore
          node tools/generate-data.mjs --force --city denver
          node tools/generate-data.mjs --force --city longbeach
          node tools/generate-data.mjs --force --city sandiego
          node tools/generate-data.mjs --force --city vancouver
          node tools/generate-data.mjs --force --city neworleans
          node tools/generate-data.mjs --force --city detroit
          node tools/generate-data.mjs --force --city minneapolis
          node tools/generate-data.mjs --force --city cleveland
          node tools/generate-data.mjs --force --city kansascity

      # Incremental — cached areas are skipped, so a normal run fetches nothing
      # and never touches Overpass. Only genuinely new areas cost a request.
      - name: Refresh basemaps
        run: |
          node tools/fetch-basemap.mjs
          node tools/fetch-basemap-osm.mjs --city london
          node tools/fetch-basemap-osm.mjs --city chicago
          node tools/fetch-basemap-osm.mjs --city la
          node tools/fetch-basemap-osm.mjs --city sf
          node tools/fetch-basemap-osm.mjs --city seattle
          node tools/fetch-basemap-osm.mjs --city toronto
          node tools/fetch-basemap-osm.mjs --city dc
          node tools/fetch-basemap-osm.mjs --city boston
          node tools/fetch-basemap-osm.mjs --city philly
          node tools/fetch-basemap-osm.mjs --city baltimore
          node tools/fetch-basemap-osm.mjs --city denver
          node tools/fetch-basemap-osm.mjs --city longbeach
          node tools/fetch-basemap-osm.mjs --city sandiego
          node tools/fetch-basemap-osm.mjs --city vancouver
          node tools/fetch-basemap-osm.mjs --city neworleans
          node tools/fetch-basemap-osm.mjs --city detroit
          node tools/fetch-basemap-osm.mjs --city minneapolis
          node tools/fetch-basemap-osm.mjs --city cleveland
          node tools/fetch-basemap-osm.mjs --city kansascity

      # The homepage states "Requires iOS X+" by hand, and it went stale the day
      # 1.2.3 dropped the floor from 26.4 to 16.4 — telling older iPhones they
      # could not install an app they could. This copies the App Store's own
      # answer; the commit step below picks up any correction. It never fails
      # the run (an unreachable lookup is not a content error).
      - name: Keep App Store facts on the site true
        run: node tools/check-app-facts.mjs

      # The transparency dataset is MEASURED in the backend repo (the providers
      # live there) and pushed here by its monthly-data-audit job, which runs on
      # the 1st so the data is waiting by the time this runs on the 2nd.
      # Guarded: a missing file skips the page rather than failing a 25-minute
      # rebuild of 1,222 pages over one auxiliary page.
      - name: Render the transparency page
        run: |
          if [ -f tools/data/transparency-index.json ]; then
            node tools/render-transparency.mjs || echo "::warning::transparency render refused (short or bad dataset) — /transparency/ left as-is"
          else
            echo "::warning::no transparency dataset — /transparency/ left as-is"
          fi

      # After the transparency page, because the sitemap includes it.
      - name: Render pages
        run: node tools/render-pages.mjs

      - name: Commit + push if anything changed
        run: |
          git config user.name "saferoute-bot"
          git config user.email "minhaj@safe-route.app"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "safety pages: monthly data refresh"
          git push
